spring.application.name=pharmacy-redis-cache
server.port=8080

# ========== DATABASE (PostgreSQL) ==========
spring.datasource.url=jdbc:postgresql://localhost:5432/pharmacy
spring.datasource.username=postgres
spring.datasource.password=postgres
# MySQL: spring.datasource.url=jdbc:mysql://localhost:3306/pharmacy

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# In câu lệnh SQL ra log -> để kiểm chứng lần 1 có SQL, lần 2 không có
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ========== REDIS làm CACHE PROVIDER ==========
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
# spring.data.redis.password=
spring.data.redis.timeout=2000ms

# TTL mặc định cho mọi cache: 60 phút (hết hạn thì Redis tự xoá key)
spring.cache.redis.time-to-live=60m
spring.cache.redis.cache-null-values=false
# Key trong Redis có dạng: medicines::1
spring.cache.redis.use-key-prefix=true
# Riêng cache "medicines": TTL 60 phút (được đọc trong RedisCacheConfig)
app.cache.medicines-ttl=60m

# Log để thấy cache hit/miss
logging.level.org.springframework.cache=TRACE
logging.level.com.pharmacy=INFO
